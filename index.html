<script>
(function () {
  var NAMES = { 3: '삼각', 4: '사각', 5: '오각', 6: '육각' };
  var HANJA = { 4: '사', 5: '오', 6: '육', 7: '칠', 8: '팔' };
  var KIND = { prism: '기둥', pyramid: '뿔', frustum: '뿔대' };
  // 순서: 익숙한 상자 → 삼각기둥 → 사각뿔 → 오각기둥 → 삼각뿔 → 사각뿔대
  var SOLIDS = [
    { kind: 'prism', n: 4 }, { kind: 'prism', n: 3 }, { kind: 'pyramid', n: 4 },
    { kind: 'prism', n: 5 }, { kind: 'pyramid', n: 3 }, { kind: 'frustum', n: 4 }
  ];
  var MODES = [
    { key: 'face', word: '면', cls: 'c-face', tip: '평평한 부분' },
    { key: 'edge', word: '모서리', cls: 'c-edge', tip: '면과 면이 만나는 선' },
    { key: 'vertex', word: '꼭짓점', cls: 'c-vertex', tip: '뾰족한 점' }
  ];

  function build(s) {
    var n = s.n, V = [], F = [], i, h = s.kind === 'pyramid' ? 1.7 : 1.5;
    var rt = s.kind === 'prism' ? 1 : s.kind === 'frustum' ? 0.55 : 0;
    var off = n === 4 ? Math.PI / 4 : -Math.PI / 2;
    for (i = 0; i < n; i++) { var a = off + i * 2 * Math.PI / n; V.push([Math.cos(a), -h / 2, Math.sin(a)]); }
    if (rt === 0) { V.push([0, h / 2, 0]); for (i = 0; i < n; i++) F.push([i, (i + 1) % n, n]); }
    else {
      for (i = 0; i < n; i++) { var b = off + i * 2 * Math.PI / n; V.push([rt * Math.cos(b), h / 2, rt * Math.sin(b)]); }
      var top = []; for (i = 0; i < n; i++) top.push(n + i); F.push(top);
      for (i = 0; i < n; i++) F.push([i, (i + 1) % n, n + (i + 1) % n, n + i]);
    }
    var bottom = []; for (i = 0; i < n; i++) bottom.push(i); F.push(bottom);
    // 면의 꼭짓점 순서를 바깥을 향하게 맞춘다 (볼록한 도형이므로 중심에서 멀어지는 쪽이 바깥)
    F = F.map(function (f) {
      var c = [0, 0, 0]; f.forEach(function (k) { c[0] += V[k][0] / f.length; c[1] += V[k][1] / f.length; c[2] += V[k][2] / f.length; });
      var p = V[f[0]], q = V[f[1]], r = V[f[2]];
      var u = [q[0] - p[0], q[1] - p[1], q[2] - p[2]], w = [r[0] - q[0], r[1] - q[1], r[2] - q[2]];
      var nx = u[1] * w[2] - u[2] * w[1], ny = u[2] * w[0] - u[0] * w[2], nz = u[0] * w[1] - u[1] * w[0];
      return (nx * c[0] + ny * c[1] + nz * c[2]) < 0 ? f.slice().reverse() : f;
    });
    var E = [], seen = {};
    F.forEach(function (f, fi) {
      for (var k = 0; k < f.length; k++) {
        var a2 = f[k], b2 = f[(k + 1) % f.length], key = Math.min(a2, b2) + '-' + Math.max(a2, b2);
        if (seen[key] === undefined) { seen[key] = E.length; E.push({ a: a2, b: b2, faces: [fi] }); } else E[seen[key]].faces.push(fi);
      }
    });
    return { V: V, F: F, E: E };
  }
  function solidName(s) { return NAMES[s.n] + KIND[s.kind]; }
  // 받침이 있으면 이/을/은, 없으면 가/를/는
  function josa(w, withB, without) { var c = w.charCodeAt(w.length - 1) - 0xAC00; return w + ((c >= 0 && c % 28) ? withB : without); }
  function faceCount(s) { return s.kind === 'pyramid' ? s.n + 1 : s.n + 2; }

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  var W = 0, H = 0, dpr = 1;
  var st = { si: 0, step: 0, geo: null, sel: [], yaw: 0.6, pitch: 0.38, tries: 0, flash: 0, log: [], results: [], shape: null, kindPick: null };
  // step: 0 이름 짓기 / 1 면 / 2 모서리 / 3 꼭짓점 (활동 2에서 배운 이름을 먼저 떠올리고 센다)
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function project() {
    var cy = Math.cos(st.yaw), sy = Math.sin(st.yaw), cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
    var scale = Math.min(W, H) * 0.36, ox = W / 2, oy = H / 2 + 6;
    return st.geo.V.map(function (v) {
      var x = v[0] * cy + v[2] * sy, z = -v[0] * sy + v[2] * cy, y = v[1];
      var y2 = y * cp - z * sp, z2 = y * sp + z * cp;
      return { x: ox + x * scale, y: oy - y2 * scale, z: z2 };
    });
  }
  function frontFacing(P, f) {     // 화면에서 반시계 방향이면 앞면
    var a = 0; for (var k = 0; k < f.length; k++) { var p = P[f[k]], q = P[f[(k + 1) % f.length]]; a += p.x * q.y - q.x * p.y; }
    return a < 0;
  }
  function centroid(P, f) { var x = 0, y = 0, z = 0; f.forEach(function (k) { x += P[k].x; y += P[k].y; z += P[k].z; }); return { x: x / f.length, y: y / f.length, z: z / f.length }; }
  function mode() { return MODES[Math.max(0, st.step - 1)]; }
  function total() { var g = st.geo; return st.step === 1 ? g.F.length : st.step === 2 ? g.E.length : g.V.length; }

  function badge(x, y, num, color) {
    var r = Math.max(13, Math.min(W, H) * 0.028);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = css('--btn-fg'); ctx.font = (r * 1.15) + 'px ' + css('--display'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(num), x, y + 1);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    var g = st.geo, P = project(), m = st.step >= 1 ? mode().key : 'none';
    var cFace = css('--face'), cEdge = css('--edge'), cVertex = css('--vertex'), fg = css('--fg'), muted = css('--muted');
    var front = g.F.map(function (f) { return frontFacing(P, f); });
    var blink = st.flash > 0 && Math.floor(st.flash / 180) % 2 === 0;
    var order = g.F.map(function (f, i) { return i; }).sort(function (a, b) { return front[a] - front[b]; });   // 뒷면 먼저
    order.forEach(function (fi) {
      var f = g.F[fi], isSel = m === 'face' && st.sel.indexOf(fi) >= 0, miss = m === 'face' && blink && !isSel;
      ctx.beginPath(); f.forEach(function (k, j) { j ? ctx.lineTo(P[k].x, P[k].y) : ctx.moveTo(P[k].x, P[k].y); }); ctx.closePath();
      ctx.globalAlpha = isSel ? (front[fi] ? 0.82 : 0.4) : miss ? 0.55 : (front[fi] ? 0.72 : 0.25);
      ctx.fillStyle = isSel ? cFace : miss ? cFace : (front[fi] ? css('--solid') : css('--solid-back'));
      ctx.fill(); ctx.globalAlpha = 1;
    });
    g.E.forEach(function (e, ei) {
      var hidden = !front[e.faces[0]] && !front[e.faces[1]], isSel = m === 'edge' && st.sel.indexOf(ei) >= 0, miss = m === 'edge' && blink && !isSel;
      ctx.beginPath(); ctx.moveTo(P[e.a].x, P[e.a].y); ctx.lineTo(P[e.b].x, P[e.b].y);
      ctx.setLineDash(hidden ? [7, 6] : []); ctx.lineCap = 'round';
      ctx.strokeStyle = isSel || miss ? cEdge : (hidden ? muted : fg);
      ctx.lineWidth = isSel ? 7 : miss ? 6 : (m === 'edge' ? 3.5 : 2.5); ctx.globalAlpha = hidden && !isSel ? 0.7 : 1;
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    });
    if (m === 'vertex') {
      g.V.forEach(function (v, vi) {
        var isSel = st.sel.indexOf(vi) >= 0, miss = blink && !isSel;
        ctx.beginPath(); ctx.arc(P[vi].x, P[vi].y, isSel || miss ? 9 : 7, 0, Math.PI * 2);
        ctx.fillStyle = isSel || miss ? cVertex : css('--panel'); ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = isSel || miss ? cVertex : fg; ctx.stroke();
      });
    }
    // 누른 순서대로 번호를 붙여 준다 (세다가 잊지 않게)
    st.sel.forEach(function (id, order2) {
      if (m === 'face') { var c = centroid(P, g.F[id]); badge(c.x, c.y, order2 + 1, cFace); }
      else if (m === 'edge') { var e = g.E[id]; badge((P[e.a].x + P[e.b].x) / 2, (P[e.a].y + P[e.b].y) / 2, order2 + 1, cEdge); }
      else if (m === 'vertex') { badge(P[id].x, P[id].y - 24, order2 + 1, cVertex); }
    });
  }

  function pick(x, y) {
    var g = st.geo, P = project(), m = mode().key, best = -1, bd = 1e9, i;
    if (m === 'vertex') {
      for (i = 0; i < P.length; i++) { var d = Math.hypot(P[i].x - x, P[i].y - y) - P[i].z * 2; if (Math.hypot(P[i].x - x, P[i].y - y) < 36 && d < bd) { bd = d; best = i; } }
    } else if (m === 'edge') {
      for (i = 0; i < g.E.length; i++) {
        var a = P[g.E[i].a], b = P[g.E[i].b], dx = b.x - a.x, dy = b.y - a.y, t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy)));
        var dist = Math.hypot(a.x + t * dx - x, a.y + t * dy - y), score = dist - (a.z + b.z);
        if (dist < 24 && score < bd) { bd = score; best = i; }
      }
    } else {
      for (i = 0; i < g.F.length; i++) {
        var f = g.F[i]; if (!frontFacing(P, f)) continue;
        var inside = false;
        for (var k = 0, j = f.length - 1; k < f.length; j = k++) {
          var p = P[f[k]], q = P[f[j]];
          if ((p.y > y) !== (q.y > y) && x < (q.x - p.x) * (y - p.y) / (q.y - p.y) + p.x) inside = !inside;
        }
        if (inside) { best = i; break; }       // 앞을 향한 면은 서로 겹치지 않는다
      }
    }
    return best;
  }

  var $ = function (id) { return document.getElementById(id); };
  function say(t, good, sub) { var cls = good ? 'good' : '';
    var el = $('msg'); el.className = cls || ''; el.textContent = '';
    if (!t) return;
    if (sub === undefined) { var mm = /^(.+?[.!?])\s+(.+)$/.exec(t); if (mm) { t = mm[1]; sub = mm[2]; } }   // 첫 문장은 굵게, 나머지는 작게
    var b = document.createElement('b'); b.textContent = t; el.appendChild(b);
    if (sub) { var s = document.createElement('span'); s.className = 'sub'; s.textContent = sub; el.appendChild(s); }
  }
  function anim(el, c) { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }

  function showTask() {
    var s = SOLIDS[st.si], counting = st.step >= 1;
    $('progress').textContent = '도형 ' + (st.si + 1) + ' / ' + SOLIDS.length;
    $('pbar3').style.width = Math.round((st.si * 4 + st.step) / (SOLIDS.length * 4) * 100) + '%';
    $('choices').hidden = counting; $('reset').hidden = !counting; $('done').hidden = !counting; $('next').hidden = true;
    $('count').textContent = '';
    if (counting) {
      var m = mode();
      $('task').innerHTML = '<b class="' + m.cls + '">' + m.word + '</b>' + josa(m.word, '을', '를').slice(m.word.length) + ' 모두 눌러 보세요';
      $('hint').textContent = m.word + ' = ' + m.tip + ' · 손가락으로 밀면 도형이 돌아가요';
      $('count').className = m.cls; updateCount(); say('');
    } else {
      $('hint').textContent = '도형을 돌려 보며 밑면의 모양을 찾아보세요';
      $('task').textContent = '먼저 이 도형의 이름을 지어 보세요';
      st.shape = null; st.kindPick = null; renderChoices(); say('밑면의 모양과 도형의 종류를 하나씩 고르세요.');
    }
    draw();
  }
  function updateCount() { $('count').textContent = st.sel.length + '개'; }

  function renderChoices() {
    var box = $('choices'); box.innerHTML = '';
    [['밑면 모양', [3, 4, 5, 6].map(function (n) { return [n, NAMES[n] + '형']; }), 'shape'],
     ['도형의 종류', [['prism', '기둥'], ['pyramid', '뿔'], ['frustum', '뿔대']], 'kindPick']].forEach(function (grp) {
      var row = document.createElement('div'); row.className = 'row';
      var lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = grp[0]; row.appendChild(lab);
      grp[1].forEach(function (opt) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'pick' + (st[grp[2]] === opt[0] ? ' sel' : ''); b.textContent = opt[1];
        b.id = 'pick-' + grp[2] + '-' + opt[0];
        b.addEventListener('click', function () { st[grp[2]] = opt[0]; renderChoices(); checkName(); });
        row.appendChild(b);
      });
      box.appendChild(row);
    });
  }
  function checkName() {
    if (st.shape === null || st.kindPick === null) return;
    var s = SOLIDS[st.si], picked = NAMES[st.shape] + KIND[st.kindPick];
    if (st.shape === s.n && st.kindPick === s.kind) {
      st.results[st.si].name = solidName(s);
      say('맞아요! 밑면이 ' + NAMES[s.n] + '형인 ' + KIND[s.kind] + ' → ' + solidName(s) + '. 이제 면, 모서리, 꼭짓점을 세어 볼까요?', true);
      Array.prototype.forEach.call(document.querySelectorAll('button.pick'), function (b) { b.disabled = true; });
      $('next').hidden = false;
    } else {
      st.log.push(solidName(s) + '의 이름을 "' + picked + '"(이)라고 함');
      st.results[st.si].nameMiss = (st.results[st.si].nameMiss || []).concat(picked);
      var shapeWrong = st.shape !== s.n, kindWrong = st.kindPick !== s.kind;
      say(shapeWrong ? '밑면의 모양을 다시 볼까요? 도형을 돌려서 바닥에 닿는 면의 변을 세어 보세요.'
                     : '위가 한 점으로 모이면 뿔, 윗면과 아랫면이 똑같으면 기둥, 윗면이 아랫면보다 작으면 뿔대예요. 다시 골라 보세요.');
      // 틀린 쪽만 지워서 다시 고르게 한다 (맞은 쪽은 그대로 둔다)
      if (shapeWrong) st.shape = null;
      if (kindWrong) st.kindPick = null;
      renderChoices(); anim($('choices'), 'shake');
    }
  }

  function onDone() {
    var s = SOLIDS[st.si], m = mode(), tot = total(), r = st.results[st.si];
    if (st.sel.length === tot) {
      anim($('count'), 'bump'); r[m.key] = tot; say(josa(m.word, '은', '는') + ' 모두 ' + tot + '개! 잘 찾았어요.' + (m.key === 'face' && HANJA[tot] ? ' 면이 ' + tot + '개인 다면체라서 ' + HANJA[tot] + '면체이기도 해요.' : ''), true);
      $('done').hidden = true; $('reset').hidden = true; $('next').hidden = false;
    } else {
      st.tries++; anim($('done'), 'shake');
      st.log.push((s.preview ? '사각뿔대' : solidName(s)) + '의 ' + josa(m.word, '을', '를') + ' ' + st.sel.length + '개라고 함 (실제 ' + tot + '개)');
      r[m.key + 'Miss'] = (r[m.key + 'Miss'] || []).concat(st.sel.length);
      if (st.tries >= 2) { say('아직 못 찾은 ' + josa(m.word, '이', '가') + ' 있어요. 깜빡이는 곳을 보세요.'); flashMissing(); }
      else say('아직 못 찾은 ' + josa(m.word, '이', '가') + ' 있어요. 도형을 돌려서 뒤쪽도 찾아보세요.');
    }
  }
  var flashRaf = 0;
  function flashMissing() {
    cancelAnimationFrame(flashRaf); var t0 = performance.now();
    (function tick(now) { st.flash = 1 + (now - t0); if (now - t0 < 1500) { draw(); flashRaf = requestAnimationFrame(tick); } else { st.flash = 0; draw(); } })(t0);
  }
  function onNext() {
    st.sel = []; st.tries = 0;
    if (st.step < 3) st.step++; else { st.si++; st.step = 0; if (st.si < SOLIDS.length) { st.geo = build(SOLIDS[st.si]); st.yaw = 0.6; st.pitch = 0.38; } }
    if (st.si >= SOLIDS.length) return showResult();
    showTask();
  }

  function showResult() {
    $('play').hidden = true; $('result').hidden = false;
    var cell = function (r, k) { return '<td>' + (r[k] || '') + (r[k + 'Miss'] ? '<span class="miss">처음엔 ' + r[k + 'Miss'].join(', ') + '개</span>' : '') + '</td>'; };
    $('rtable').innerHTML = '<tr><th>도형</th><th>면</th><th>모서리</th><th>꼭짓점</th></tr>' + SOLIDS.map(function (s, i) {
      var r = st.results[i];
      return '<tr><td>' + (s.preview ? '사각뿔대' : solidName(s)) + (r.nameMiss ? '<span class="miss">이름을 ' + r.nameMiss.join(', ') + '(이)라고 함</span>' : '') + '</td>' + cell(r, 'face') + cell(r, 'edge') + cell(r, 'vertex') + '</tr>';
    }).join('');
    var e = $('errors');
    if (!st.log.length) { e.className = 'clean'; e.textContent = '한 번도 틀리지 않았어요!'; }

        var it = B.item, ok = ci === it.cat;
        Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; });
        b.classList.add('sel'); b.disabled = false;
        if (ok) B.score++; else B.wrongs.push(it);
        B.res.push({ it: it, ok: ok });
        stampTag(it.cat === 3 ? '셋 다 아니에요 ✕' : CAT[it.cat] + ' ○', it.cat === 3 ? 'no' : 'yes'); nameTag(it.name);
        if (B.extraLater) {   // 점선 끝까지 화면에 들어오게 다시 맞춘다
          var M = B.M, pts = M.V.slice(); M.extra = B.extraLater; M.extra.forEach(function (s) { pts.push(s[1]); });
          var lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
          pts.forEach(function (v) { for (var q = 0; q < 3; q++) { lo[q] = Math.min(lo[q], v[q]); hi[q] = Math.max(hi[q], v[q]); } });
          M.c = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2]; M.R = 0;
          pts.forEach(function (v) { M.R = Math.max(M.R, Math.hypot(v[0] - M.c[0], v[1] - M.c[1], v[2] - M.c[2])); });
        }
        say((ok ? '맞아요! ' : '아쉬워요. 이 도형은 ') + VERD[it.cat], ok ? 'good' : 'bad', it.why);
        if (!ok) anim(b, 'shake');
        setNext(B.i === B.order.length - 1 ? '결과 보기' : '다음');
      });
      box.appendChild(b);
    });
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function steps() {
    var L = ['자르기', '윗면 바꾸기', '네 칸 분류'], ph = B.phase;
    var cur = { cut: 0, slant: 0, slider: 1, sort: 2, done: 3 }[ph];
    var frac = ph === 'slant' ? 0.5 : ph === 'sort' ? B.i / B.order.length : ph === 'done' ? 1 : 0;
    $('a2steps').innerHTML = L.map(function (t, k) { return '<li class="' + (k < cur ? 'done' : k === cur ? 'on' : '') + '">' + t + '</li>'; }).join('');
    $('a2pbar').style.width = Math.round(Math.min(1, (Math.min(cur, 2) + frac) / 3) * 100) + '%';
  }
  function drawThumbs() {
    requestAnimationFrame(function () { var col = G.colors(); (B.res || []).forEach(function (r, k) { var c = $('a2r' + k); if (!r.M) r.M = r.it.make(); if (c && G.fit(c)) G.render(c, r.M, 0.6, 0.4, 0.42, 1.8, col); }); });
  }
  window.addEventListener('resize', function () { if (B.phase === 'done') drawThumbs(); });

  function show() {
    var ph = B.phase;
    $('a2stage').hidden = ph === 'done'; $('a2result').hidden = ph !== 'done';
    $('a2top').hidden = ph === 'done'; $('a2bar').hidden = ph === 'done';
    $('a2ctrl').innerHTML = ''; $('a2choices').innerHTML = ''; say(''); setNext(null); nameTag(''); stampTag('');
    steps();
    B.yaw = 0.6; B.spin = true; B.pitch = 0.38;
    if (ph === 'cut' || ph === 'slant') {
      B.cut = false; B.sep = 0;
      $('a2prog').textContent = '1단계 · 각뿔 자르기';
      $('a2task').textContent = ph === 'cut' ? '각뿔을 밑면에 평행하게 잘라 보세요' : '이번엔 비스듬히 잘라 볼까요?';
      if (ph === 'cut') def(''); cutUI(); B.cut = true; rejoin();
    } else if (ph === 'slider') {
      $('a2prog').textContent = '2단계 · 윗면 크기 바꾸기';
      $('a2task').textContent = '윗면 크기를 바꿔 각기둥, 각뿔대, 각뿔을 모두 만들어 보세요';
      B.seen = {}; B.s = 0.5;
      var box = $('a2ctrl');
      box.appendChild(baseRow(sliderUpdate));
      box.appendChild(sliderRow('윗면 크기', 0, 100, 50, function (v) { B.s = v / 100; sliderUpdate(); }));
      sliderUpdate(); B.pitch = 0.45;
    } else if (ph === 'sort') {
      $('a2prog').textContent = '3단계 · 네 칸 분류 ' + (B.i + 1) + ' / ' + B.order.length;
      $('a2task').textContent = '이 도형은 어느 칸에 들어갈까요?';
      def(DEF_SORT);
      B.item = B.order[B.i]; B.answered = false;
      B.M = B.item.make(); B.extraLater = B.M.extra || null; B.M.extra = null;
      sortButtons();
    } else {
      def('');
      var r = $('a2result');
      r.innerHTML = '<h2>' + B.order.length + '개 중 ' + B.score + '개 맞혔어요!</h2>' +
        '<p>각기둥 4개, 각뿔 4개, 각뿔대 4개, 셋 다 아닌 도형 6개가 섞여 있었어요. 선생님께 이 화면을 보여 주세요.</p>' +
        '<div class="rgrid">' + B.res.map(function (r, k) { return '<div class="rcell ' + (r.ok ? 'ok' : 'no') + '"><canvas id="a2r' + k + '"></canvas><b>' + (r.ok ? '✓' : '✕') + '</b><span>' + r.it.name + '</span></div>'; }).join('') + '</div>' +
        (B.wrongs.length
          ? '<div class="wrongs"><b>다시 볼 도형 ' + B.wrongs.length + '개</b><ul>' + B.wrongs.map(function (it) { return '<li><b>' + it.name + '</b> → ' + CAT[it.cat] + ': ' + it.why.replace('(점선)', '') + '</li>'; }).join('') + '</ul></div>'
          : '<div class="wrongs clean">하나도 틀리지 않았어요!</div>') +
        '<div class="row"><button type="button" id="a2again">처음부터 다시</button><button type="button" id="a2go3" class="primary">활동 3: 입체도형 세어 보기 →</button></div>';
      $('a2again').addEventListener('click', function () { B.phase = 'cut'; show(); });
      $('a2go3').addEventListener('click', function () { window.__showAct(3); });
      drawThumbs();
    }
  }
  $('a2next').addEventListener('click', function () {
    if (B.phase === 'cut') B.phase = 'slant';
    else if (B.phase === 'slant') B.phase = 'slider';
    else if (B.phase === 'slider') { B.phase = 'sort'; B.i = 0; B.order = shuffle(ITEMS); B.score = 0; B.wrongs = []; B.res = []; }
    else if (B.phase === 'sort') { if (++B.i >= B.order.length) B.phase = 'done'; }
    show();
  });

  var stage = $('a2stage'), drag = null;
  stage.addEventListener('pointerdown', function (e) { stage.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, yaw: B.yaw, pitch: B.pitch }; B.spin = false; });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    B.yaw = drag.yaw + (e.clientX - drag.x) * 0.01; B.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + (e.clientY - drag.y) * 0.01));
  });
  stage.addEventListener('pointerup', function () { drag = null; });
  stage.addEventListener('pointercancel', function () { drag = null; });

  var last = 0;
  function loop(t) {
    var dt = Math.min(50, t - (last || t)); last = t;
    if (!$('act2').hidden && !$('a2stage').hidden) {
      if (B.phase === 'cut' || B.phase === 'slant') B.M = cutMesh();
      if (B.spin) B.yaw += dt * 0.0005;
      var cv = $('a2cv');
      if (B.M && G.fit(cv)) G.render(cv, B.M, B.yaw, B.pitch, 0.47, 3, G.colors());
    }
    requestAnimationFrame(loop);
  }
  show(); requestAnimationFrame(loop);
})();
</script>

</body></html>
